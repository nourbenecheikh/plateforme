

services:
  frontend:
    build: ./client
    ports:
      - "3000:80"  

  backend:
    build: ./api
    ports:
      - "8800:8800"
    environment:
      - MONGO_URI=mongodb://mongo:27017/mydb 
    env_file:
      - .env
    depends_on:
      - mongo
    volumes:
      - ../.env:/app/.env  


  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:


 
