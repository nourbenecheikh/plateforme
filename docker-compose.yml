version: '3.8'

services:
  frontend:
    build: ./client
    ports:
      - "3000:80"  

  backend:
    build: ./api
    ports:
      - "8800:8800"
    environment:
      - MONGO=mongodb://mongo:27017/mydb
    depends_on:
      - mongo

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:

