events {}

http {
    upstream backend {
        server backend:8080;  
    }

    upstream frontend {
        server frontend:80; 
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://backend;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location / {
            proxy_pass http://frontend;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}
