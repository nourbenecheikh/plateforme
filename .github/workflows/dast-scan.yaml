name: ZAP DAST Scan

on:
  workflow_dispatch:
  push:
    branches:
      - Dast-scan

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: OWASP ZAP Baseline Scan
        id: zap
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: 'https://e9d0e882c4c7.ngrok-free.app'
          docker_name: 'ghcr.io/zaproxy/zaproxy'
          cmd_options: '-J zap_report.json -w zap_report.md -r zap_report.html'

      - name: Display ZAP Scan Results in Logs
        run: |
          echo "ZAP Scan Results:"
          cat zap_report.json
