
name: ZAP DAST Scan

on:
  workflow_dispatch:
  push:
    branches:
      - Dast-scan

permissions:  # 👈 AJOUTER CECI
  contents: Read
  pull-requests: write

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: OWASP ZAP Baseline Scan
        id: zap
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: 'https://aed1e513a1ea.ngrok-free.app'
          docker_name: 'ghcr.io/zaproxy/zaproxy'
          report_json: '/zap/reports/zap_report.json'  # Assure-toi de spécifier ici le rapport généré

      - name: Display ZAP Scan Results in Logs
        run: |
          echo "ZAP Scan Results:"
          cat /zap/reports/zap_report.json  # Afficher le rapport JSON dans les logs
