name: ZAP DAST Scan

on:
  workflow_dispatch:
  push:
    branches:
      - Dast-scan

permissions:  # 👈 AJOUTER CECI
  contents: read
  issues: write
  pull-requests: write
jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: 'https://aed1e513a1ea.ngrok-free.app'
          docker_name: 'ghcr.io/zaproxy/zaproxy'
