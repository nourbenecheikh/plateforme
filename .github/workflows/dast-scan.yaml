name: ZAP DAST Scan

on:
  workflow_dispatch:
  push:
    branches:
      - Dast-scan

permissions:  # 👈 AJOUTER CECI
  contents: write
  pull-requests: write
jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: OWASP ZAP Baseline Scan
        id: zap
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: 'https://aed1e513a1ea.ngrok-free.app'
          docker_name: 'ghcr.io/zaproxy/zaproxy'
          report_json: 'zap_report.json'
     
      
      - name: Upload ZAP Reports as Artifacts
        uses: actions/upload-artifact@v2
        with:
          name: zap-reports
          path: |
            zap_report.json
