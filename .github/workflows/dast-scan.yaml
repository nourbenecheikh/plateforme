name: ZAP DAST Scan

on:
  workflow_dispatch:
  push:
    branches:
      - Dast-scan

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run ZAP Scan for Localhost
        run: |
          mkdir -p zap-reports/results
          docker run --rm \
            -v ${{ github.workspace }}/zap-reports/results:/zap/wrk/results:rw \
            -p 8080:8080 \
            ghcr.io/zaproxy/zaproxy zap-baseline.py \
            -t http://localhost:3000 \
            -J results/zap_report.json \
            

      - name: Display ZAP Scan Markdown Report
        run: |
          echo "📋 ZAP Scan Markdown Report:"
          echo "-----------------------------------------"
          cat zap-reports/results/zap_report.json
