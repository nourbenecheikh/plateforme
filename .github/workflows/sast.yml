name: SAST Scan with Semgrep

on:
  push:
    branches:
      - fullstack-fiverr
  pull_request:
    branches:
      - fullstack-fiverr

jobs:
  sast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # Run Semgrep for Backend and display results in logs
      - name: Run Semgrep on Backend and Display Results
        run: |
          docker run --rm -v "$PWD/api:/src" returntocorp/semgrep semgrep --config p/default /src
          
      # Run Semgrep for Frontend and display results in logs
      - name: Run Semgrep on Frontend and Display Results
        run: |
          docker run --rm -v "$PWD/client:/src" returntocorp/semgrep semgrep --config p/default /src

