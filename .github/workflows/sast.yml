name: SAST Scan with Semgrep

on:
  push:
    branches:
      - fullstack-fiverr
  pull_request:
    branches:
      - fullstack-fiverr

jobs:
  sast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run Semgrep for Backend
        run: |
          docker run --rm -v "$PWD/api:/src" returntocorp/semgrep semgrep --config p/default /src
      
      - name: Run Semgrep for Frontend
        run: |
          docker run --rm -v "$PWD/client:/src" returntocorp/semgrep semgrep --config p/default /src

      - name: Upload SARIF results as Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: semgrep-scan-results
          path: semgrep-results/
