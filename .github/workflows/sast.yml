name: SAST Scan with Semgrep

on:
  push:
    branches:
      - fullstack-fiverr
  pull_request:
    branches:
      - fullstack-fiverr

jobs:
  sast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run Semgrep for Backend
        run: |
          docker pull nourben585/backend:latest
          docker run --rm -v "$PWD/api:/src" nourben585/backend:latest semgrep --config p/default /src

      - name: Run Semgrep for Frontend
        run: |
          docker pull nourben585/frontend:latest
          docker run --rm -v "$PWD/client:/src" nourben585/frontend:latest semgrep --config p/default /src

